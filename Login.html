<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login proyecto</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/Login.css">
</head>
<body>

    <main class="auth-wrapper">
        <div class="auth-card">

            <div class="auth-icon">✚</div>

            <h1 class="auth-title">Iniciar sesión</h1>
            <p class="auth-subtitle">Bienvenido de nuevo 👋</p>

            <form id="loginForm" class="auth-form">
                <div class="field-group">
                    <label for="email" class="field-label">Correo electrónico</label>
                    <input type="email" id="email" class="field-input" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="field-group">
                    <label for="password" class="field-label">Contraseña</label>
                    <div class="input-with-toggle">
                        <input type="password" id="password" class="field-input" placeholder="••••••••" required>
                        <button class="toggle-visibility" type="button" onclick="togglePassword('password', this)" aria-label="Mostrar contraseña">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-guardar">INICIAR SESIÓN</button>
            </form>

            <p class="auth-footer">
                ¿No tienes cuenta? <a href="Registro.html" class="auth-link">Regístrate</a>
            </p>

        </div>
    </main>

    <script>
        function togglePassword(id, btn) {
            const input = document.getElementById(id);
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            btn.style.color = isHidden ? '#3b9eda' : '#8fa3b1';
        }
    </script>
    <script src="funciones/Login.js"></script>
</body>
</html>
